name: Flutter Build & Launch Icons

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Generate App Launcher Icons
        run: dart run flutter_launcher_icons

      # 🔑 Step 1: Keystore Check (Repo wale Keystore ko runner me restore karna)
      - name: Setup Permanent Debug Keystore
        run: |
          mkdir -p ~/.android
          if [ -f ./android/app/debug.keystore ]; then
            cp ./android/app/debug.keystore ~/.android/debug.keystore
          elif [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug, O=Android, C=US"
          fi

      # 🔑 Step 2: Print Fixed SHA-1 & Key Hash
      - name: Get Build SHA-1 Key
        run: |
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
