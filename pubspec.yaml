name: basp
description: A new Flutter project for Local Services in Assam.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Dependencies (Stable compatible combo)
  firebase_core: 2.24.2
  firebase_auth: 4.16.0
  google_sign_in: ^6.2.1
  cloud_firestore: 4.14.0

  # UI & Map Dependencies
  cupertino_icons: ^1.0.5
  google_maps_flutter: ^2.5.0
  provider: ^6.0.5
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.0

  # Null Safety Supported Version for Sliding Up Panel
  sliding_up_panel:
    git:
      url: https://github.com/akshathjain/sliding_up_panel.git
      ref: master

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - lib/Temporary_data/map_data.json
