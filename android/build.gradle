buildscript {
    ext.kotlin_version = '1.8.22'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // Force modern R8 engine globally
        classpath 'com.android.tools:r8:8.2.33'
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // 🔴 FORCE LOWER FIREBASE BOM TO REMOVE RECAPTCHA 18.4.0
    configurations.all {
        resolutionStrategy {
            force 'com.google.firebase:firebase-auth:22.1.2'
            force 'com.google.android.recaptcha:recaptcha:18.1.2'
        }
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
